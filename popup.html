<!DOCTYPE html>
<html lang="zh-CN" data-i18n-doc-title="popup.docTitle">
<head>
<meta charset="utf-8">
<style>
:root{
  --surface:#fff; --surface-2:#FAFBFC; --surface-3:#F0F2F3;
  --ink:#16191C; --text:#33393E; --muted:#666F75; --faint:#939BA0;
  --line:#E4E7E9; --line-2:#D3D8DB;
  --accent:#2B6A8C; --accent-hover:#235770; --accent-bg:#EAF1F5; --accent-line:#C7DAE4;
  --ok:#2E7A57; --ok-bg:#E9F2EC; --warn:#8A6114; --warn-bg:#F7F0DE; --warn-line:#E2D2AB;
  --bad:#A13E36; --bad-bg:#F8EAE8; --bad-line:#E7C8C4;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
body{width:360px;margin:0;font-family:var(--sans);font-size:12px;color:var(--text);background:var(--surface);}
.head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
.brand{width:24px;height:24px;border-radius:4px;background:var(--accent);color:#fff;font:600 10px/24px var(--mono);text-align:center;}
.title{font-size:13px;font-weight:600;color:var(--ink);}
.body{padding:12px 14px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.card{border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--surface-2);}
.card .n{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink);}
.card .l{font-size:10.5px;color:var(--muted);}
.bar{border-radius:4px;padding:8px;font-size:11px;line-height:1.5;margin-bottom:10px;}
.bar.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);}
.bar.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);}
.bar.ok{background:var(--ok-bg);border:1px solid #CFE3D7;color:var(--ok);}
.row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #EFF1F3;}
.row .h{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .m{font-size:10px;color:var(--faint);}
button{font-family:inherit;font-size:11px;height:24px;border-radius:4px;border:1px solid var(--line-2);background:#fff;color:var(--text);cursor:pointer;}
button:hover{background:var(--surface-3);}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
button.primary:hover{background:var(--accent-hover);}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(43,106,140,.28);}
.foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2);}
.foot button{flex:1;height:28px;}
.hint{font-size:10.5px;color:var(--faint);line-height:1.5;margin-top:10px;}
</style>
</head>
<body>
<div class="head">
  <div class="brand">AP</div>
  <div class="title" data-i18n="popup.appTitle">接口代理</div>
</div>
<div class="body">
  <div class="stats">
    <div class="card"><div class="n" id="nAll">0</div><div class="l" data-i18n="popup.statRules">规则</div></div>
    <div class="card"><div class="n" id="nOn">0</div><div class="l" data-i18n="popup.statActive">生效</div></div>
    <div class="card"><div class="n" id="nPend">0</div><div class="l" data-i18n="popup.statPending">待授权</div></div>
  </div>

  <div id="syncBar" class="bar ok" data-i18n="popup.syncIdle">尚未同步</div>

  <div id="pendingWrap"></div>
  <div id="pendingEmpty" class="hint" style="display:none;" data-i18n="popup.allAuthorized">所有规则的域名都已授权。</div>

  <div class="hint" data-i18n="popup.hint">规则配置、请求头与 Mock 在「打开配置页」中维护；wsData 在 DevTools 的「wsData」标签里。</div>
</div>
<div class="foot">
  <button id="openOptions" class="primary" data-i18n="popup.openOptions">打开配置页</button>
  <button id="resync" data-i18n="popup.resync">重新同步</button>
</div>
<script src="i18n.js"></script>
<script src="i18n-popup.js"></script>
<script src="i18n-model.js"></script>
<script src="rules-model.js"></script>
<script src="popup.js"></script>
</body>
</html>
