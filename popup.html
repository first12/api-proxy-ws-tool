<!DOCTYPE html>
<html style="width:520px;padding:12px;">
<head>
<meta charset="utf-8">
<title>接口代理配置</title>
<style>
.rule-item{border:1px solid #ccc;padding:8px;margin:4px 0;border-radius:4px;}
.item-row{margin:4px 0;}
.hint{font-size:12px;color:#666;}
</style>
</head>
<body>
<h4>代理规则列表</h4>
<div id="ruleList"></div>
<hr/>
<h4>新增规则</h4>
<div class="item-row">
  <label>域名 host：</label><input id="host" placeholder="10.114.0.11" style="width:300px">
</div>
<div class="item-row">
  <label>接口路径：</label><input id="path" placeholder="/da-digital/api/sessions" style="width:300px">
  <div class="hint">支持 * 通配，例如 /api/*</div>
</div>
<div class="item-row">
  <label>类型：</label>
  <select id="ruleType">
    <option value="proxy">转发代理</option>
    <option value="mock">Mock返回</option>
  </select>
</div>

<div id="proxyConfigWrap">
  <div class="item-row">
    <label>转发模式：</label>
    <label><input type="radio" name="proxyMode" value="pathReplace" checked> 路径替换（自动继承query，推荐）</label>
    <label><input type="radio" name="proxyMode" value="fullUrl"> 完整目标URL</label>
  </div>
  <div class="item-row" id="pathReplaceRow">
    <label>替换后路径：</label><input id="proxyPathPrefix" placeholder="/da-digital-test/api/sessions" style="width:300px">
  </div>
  <div class="item-row" id="fullUrlRow" style="display:none;">
    <label>完整目标地址：</label><input id="proxyTarget" placeholder="http://xxx/xxx?a=1" style="width:300px">
  </div>
</div>

<div class="item-row">
  <label>Mock JSON：</label><textarea id="mockBody" rows="4" style="width:480px;display:none;"></textarea>
</div>

<div class="item-row">
  <button id="addBtn">添加规则</button>
</div>
<hr>
<div class="hint">
⚠️ WebSocket 不能后台劫持；抓WS报文：F12打开开发者工具，切换到【WS抓包】面板，仅查看导出，不能修改转发WS
</div>
<script src="popup.js"></script>
</body>
</html>
